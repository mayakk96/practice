name: Python banking platform

on:
  push:
    paths: ["banking-platform/**", ".github/workflows/banking-platform.yml"]
  pull_request:
    paths: ["banking-platform/**", ".github/workflows/banking-platform.yml"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: banking
          POSTGRES_USER: banking
          # This disposable CI service is isolated to the runner; no stored credentials.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U banking -d banking"
          --health-interval 5s --health-timeout 3s --health-retries 20
      kafka:
        image: apache/kafka:3.9.1
        env:
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
          KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
          KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
          KAFKA_NUM_PARTITIONS: 3
          CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
        ports: ["9092:9092"]
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"
          --health-interval 10s --health-timeout 8s --health-retries 20
    defaults:
      run:
        working-directory: banking-platform
    env:
      TEST_DATABASE_URL: postgresql+psycopg://banking@127.0.0.1:5432/banking
      KAFKA_BOOTSTRAP_SERVERS: localhost:9092
      TEST_KAFKA_BOOTSTRAP_SERVERS: localhost:9092
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: banking-platform/backend/requirements.lock
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: banking-platform/frontend/package-lock.json
      - name: Install backend and test dependencies
        run: python -m pip install -c backend/requirements.lock -e './backend[test]'
      - name: Validate Python and run unit, API, PostgreSQL and Kafka tests
        run: |
          ruff check backend scripts demo
          ruff format --check backend scripts demo
          python -m compileall -q backend/app
          pytest backend/tests -ra --junitxml=reports/pytest.xml
          python -m unittest discover -s demo/network-service -p 'test_*.py'
      - name: Build browser operations console
        working-directory: banking-platform/frontend
        run: |
          npm ci
          npm test
          npm run build
      - name: Validate Compose
        run: |
          python scripts/create_env.py
          docker compose config --quiet
      - name: Retain test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: banking-platform-test-reports
          path: banking-platform/reports/
