name: educational-banking-platform

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: banking
      POSTGRES_USER: banking
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - banking-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U banking -d banking"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9095
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9095
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    ports:
      - "127.0.0.1:9095:9095"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null"]
      interval: 10s
      timeout: 8s
      start_period: 20s
      retries: 20

  mock-network:
    build: ./demo/network-service
    environment:
      MOCK_NETWORK_SCENARIO: ${MOCK_NETWORK_SCENARIO:-normal}
      MOCK_NETWORK_FAILURES_BEFORE_SUCCESS: ${MOCK_NETWORK_FAILURES_BEFORE_SUCCESS:--1}
      MOCK_NETWORK_DELAY_MS: ${MOCK_NETWORK_DELAY_MS:-1500}

  app:
    build: ./backend
    environment: &backend-environment
      DATABASE_URL: postgresql+psycopg://banking:${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}@postgres:5432/banking
      APP_AUTH_ENABLED: "true"
      APP_DEMO: "false"
      APP_API_USERNAME: ${APP_API_USERNAME:?Set APP_API_USERNAME in .env}
      APP_API_PASSWORD: ${APP_API_PASSWORD:?Set APP_API_PASSWORD in .env}
      APP_READONLY_USERNAME: ${APP_READONLY_USERNAME:-}
      APP_READONLY_PASSWORD: ${APP_READONLY_PASSWORD:-}
      NETWORK_MODE: http
      NETWORK_BASE_URL: http://mock-network:8091
      # Preserve host proxy exclusions and keep Compose service HTTP traffic local.
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,::1},postgres,kafka,mock-network,app
      no_proxy: ${no_proxy:-localhost,127.0.0.1,::1},postgres,kafka,mock-network,app
      NETWORK_READ_TIMEOUT_SECONDS: ${NETWORK_READ_TIMEOUT_SECONDS:-1}
      NETWORK_MAX_ATTEMPTS: ${NETWORK_MAX_ATTEMPTS:-3}
      EVENTS_ENABLED: "true"
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      BANKING_EVENTS_TOPIC: banking.events.v1
      KNOWLEDGE_MODE: ${KNOWLEDGE_MODE:-deterministic}
      KNOWLEDGE_MODEL_URL: ${KNOWLEDGE_MODEL_URL:-}
      KNOWLEDGE_MODEL: ${KNOWLEDGE_MODEL:-local-model}
      KNOWLEDGE_API_KEY: ${KNOWLEDGE_API_KEY:-}
      MCP_ALLOWED_HOSTS: ${MCP_ALLOWED_HOSTS:-}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      mock-network:
        condition: service_healthy

  worker:
    build: ./backend
    restart: on-failure
    environment: *backend-environment
    command: ["python", "-m", "app.worker"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.build_opener(urllib.request.ProxyHandler({})).open('http://127.0.0.1:9095/metrics', timeout=2)"]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 10
    depends_on:
      app:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:5173:8080"
    depends_on:
      app:
        condition: service_healthy

volumes:
  banking-postgres:
