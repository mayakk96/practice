server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    location /api/ { proxy_pass http://app:8080; proxy_set_header Host $host; proxy_set_header X-Request-ID $http_x_request_id; }
    location /mcp { proxy_pass http://app:8080; proxy_set_header Host $host; }
    location /metrics { proxy_pass http://app:8080; proxy_set_header Host $host; }
    location /health { proxy_pass http://app:8080; proxy_set_header Host $host; }
    location / { try_files $uri $uri/ /index.html; }
}
