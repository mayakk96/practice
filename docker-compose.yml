name: enterprise-onboarding

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: onboarding
      POSTGRES_USER: onboarding
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Run python3 scripts/create_env.py first}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U onboarding -d onboarding"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    ports:
      - "127.0.0.1:9094:9094"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null"]
      interval: 10s
      timeout: 8s
      retries: 20
      start_period: 20s

  mock-risk:
    build: ./demo/risk-service
    environment:
      MOCK_RISK_LEVEL: ${MOCK_RISK_LEVEL:-LOW}
      MOCK_RISK_FAILURES_BEFORE_SUCCESS: ${MOCK_RISK_FAILURES_BEFORE_SUCCESS:-0}
      MOCK_RISK_DELAY_MS: ${MOCK_RISK_DELAY_MS:-0}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.build_opener(urllib.request.ProxyHandler({})).open('http://127.0.0.1:8090/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      SERVER_ADDRESS: 0.0.0.0
      DATABASE_URL: jdbc:postgresql://postgres:5432/onboarding
      DATABASE_USERNAME: onboarding
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Run python3 scripts/create_env.py first}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      APPLICATION_EVENTS_ENABLED: "true"
      APPLICATION_SCREENING_MODE: http
      APPLICATION_SCREENING_BASE_URL: http://mock-risk:8090
      APPLICATION_SECURITY_ENABLED: "true"
      APP_API_USERNAME: ${APP_API_USERNAME:?Set APP_API_USERNAME in .env}
      APP_API_PASSWORD: ${APP_API_PASSWORD:?Set APP_API_PASSWORD in .env}
      APP_READONLY_USERNAME: ${APP_READONLY_USERNAME:-}
      APP_READONLY_PASSWORD: ${APP_READONLY_PASSWORD:-}
      APPLICATION_KNOWLEDGE_MODE: ${APPLICATION_KNOWLEDGE_MODE:-deterministic}
      APPLICATION_KNOWLEDGE_BASE_URL: ${APPLICATION_KNOWLEDGE_BASE_URL:-http://localhost:11434/v1}
      APPLICATION_KNOWLEDGE_MODEL: ${APPLICATION_KNOWLEDGE_MODEL:-local-model}
      APPLICATION_KNOWLEDGE_API_KEY: ${APPLICATION_KNOWLEDGE_API_KEY:-}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      mock-risk:
        condition: service_healthy

volumes:
  postgres-data:
