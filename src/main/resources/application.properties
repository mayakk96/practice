spring.application.name=enterprise-onboarding
spring.profiles.default=postgres
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/onboarding}
spring.datasource.username=${DATABASE_USERNAME:onboarding}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true
spring.mvc.problemdetails.enabled=true
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.deserialization.fail-on-null-for-primitives=true
server.shutdown=graceful
server.error.include-message=never
server.error.include-stacktrace=never
server.tomcat.max-http-form-post-size=64KB
server.max-http-request-header-size=16KB
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
management.info.env.enabled=true
info.app.description=Fictional educational onboarding platform
logging.structured.format.console=ecs
application.security.enabled=true
application.security.username=${APP_API_USERNAME:}
application.security.password=${APP_API_PASSWORD:}
application.security.read-only-username=${APP_READONLY_USERNAME:}
application.security.read-only-password=${APP_READONLY_PASSWORD:}
application.screening.mode=stub
application.events.enabled=false
application.events.topic=onboarding.events.v1
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.delivery.timeout.ms=10000
spring.kafka.producer.properties.request.timeout.ms=5000
spring.kafka.producer.properties.max.block.ms=5000
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.observation-enabled=true
spring.kafka.template.observation-enabled=true
spring.ai.mcp.server.protocol=STATELESS
spring.ai.mcp.server.type=SYNC
spring.ai.mcp.server.name=enterprise-onboarding
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.capabilities.tool=true
spring.ai.mcp.server.capabilities.resource=false
spring.ai.mcp.server.capabilities.prompt=false
spring.ai.mcp.server.capabilities.completion=false
